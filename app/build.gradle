plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Fresh stamp on every gradle run so the running process can be identified:
// the app logs it at startup and serves it in the debug status.
def buildStamp = new Date().format('yyyy-MM-dd HH:mm:ss')

android {
    namespace 'io.ftms.bridge'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'io.ftms.bridge'
        minSdk 28          // the bike tablet is Android 9 (Pie)
        targetSdk 28
        versionCode 1
        versionName '0.1'
        buildConfigField 'String', 'BUILD_STAMP', "\"$buildStamp\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
